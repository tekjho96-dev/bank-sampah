<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Sampah</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f7f3;
      color: #1f2937;
    }

    .header {
      background: #16834b;
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .saldo {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: -5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .saldo small {
      color: #6b7280;
    }

    .saldo h2 {
      color: #16834b;
      margin-top: 8px;
      font-size: 30px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .menu button {
      border: none;
      background: white;
      padding: 18px 10px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
      font-size: 15px;
      color: #1f2937;
    }

    .menu button:active {
      transform: scale(0.97);
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .card h3 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .submit {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #16834b;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .riwayat {
      margin-top: 15px;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    .item:last-child {
      border-bottom: none;
    }

    .success {
      color: #16834b;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>♻️ Bank Sampah</h1>
    <p>Kelola sampah, dapatkan manfaat.</p>
  </div>

  <div class="container">

    <div class="saldo">
      <small>Saldo Tabungan</small>
      <h2 id="saldo">Rp0</h2>
    </div>
